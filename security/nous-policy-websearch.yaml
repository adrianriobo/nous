version: 1

# OpenShell network policy for nous with web search enabled.
#
# Extends nous-policy.yaml by adding DuckDuckGo as an allowed endpoint.
# Only use this policy when running a general-purpose session where internet
# search is acceptable. Do NOT use for code review sessions involving
# internal or confidential source code.
#
# Apply:
#   openshell sandbox create \
#     --from ghcr.io/adrianriobo/nous:latest \
#     --provider enmaas-nous \
#     --policy ./security/nous-policy-websearch.yaml

# Pi reads its runtime from /opt/pi (base image install). Landlock blocks
# access to paths not listed here or in the automatic baseline (/usr, /lib,
# /etc, /tmp). include_workdir keeps /sandbox read-write.
filesystem_policy:
  include_workdir: true
  read_only:
    - /opt/pi
    - /run/secrets

network_policies:

  # ── EnMaaS inference + model discovery ────────────────────────────────────
  # The gateway host is internal and ships as a placeholder: replace
  # enmaas-gateway.example.com with the host from your ENMAAS_BASE_URL
  # before applying this policy.
  enmaas:
    endpoints:
      - host: enmaas-gateway.example.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── GitHub — git clone for PR code reviews ───────────────────────────────
  github-git:
    endpoints:
      - host: github.com
        port: 443
        enforcement: enforce
      - host: codeload.github.com
        port: 443
        enforcement: enforce
      - host: objects.githubusercontent.com
        port: 443
        enforcement: enforce
    binaries:
      - path: /usr/bin/git

  github-api:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── Web search (DuckDuckGo) ──────────────────────────────────────────────
  web-search:
    endpoints:
      - host: lite.duckduckgo.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26
