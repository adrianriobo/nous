version: 1

# OpenShell network policy for nous with web search enabled.
#
# Extends nous-policy.yaml by adding DuckDuckGo as an allowed endpoint.
# Only use this policy when running a general-purpose session where internet
# search is acceptable. Do NOT use for code review sessions involving
# internal or confidential source code.
#
# Apply:
#   openshell sandbox create \
#     --from ghcr.io/aipcc/nous:latest \
#     --provider vertex-nous \
#     --policy ./security/nous-policy-websearch.yaml

# Pi reads its runtime from /opt/pi (base image install). Landlock blocks
# access to paths not listed here or in the automatic baseline (/usr, /lib,
# /etc, /tmp). include_workdir keeps /sandbox read-write.
filesystem_policy:
  include_workdir: true
  read_only:
    - /opt/pi
    - /run/secrets

network_policies:

  # ── Vertex AI inference ──────────────────────────────────────────────────
  vertex-ai-global:
    endpoints:
      - host: aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-us-east5:
    endpoints:
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-us-central1:
    endpoints:
      - host: us-central1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-europe-west1:
    endpoints:
      - host: europe-west1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-asia-southeast1:
    endpoints:
      - host: asia-southeast1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── Google auth / token refresh ──────────────────────────────────────────
  google-auth:
    endpoints:
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
      - host: iamcredentials.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
      - host: accounts.google.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── GitHub — git clone for PR code reviews ───────────────────────────────
  github-git:
    endpoints:
      - host: github.com
        port: 443
        enforcement: enforce
      - host: codeload.github.com
        port: 443
        enforcement: enforce
      - host: objects.githubusercontent.com
        port: 443
        enforcement: enforce
    binaries:
      - path: /usr/bin/git

  github-api:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── Web search (DuckDuckGo) ──────────────────────────────────────────────
  web-search:
    endpoints:
      - host: lite.duckduckgo.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26
