version: 1

# OpenShell network policy for nous.
#
# OpenShell denies all outbound by default. This policy allows only what
# nous needs: Vertex AI inference, Google auth, and GitHub for PR clones.
#
# Web search (DuckDuckGo) is intentionally excluded — see nous-policy-websearch.yaml.
#
# Apply at sandbox creation:
#   openshell sandbox create \
#     --from ghcr.io/aipcc/nous:latest \
#     --provider vertex-nous \
#     --policy ./security/nous-policy.yaml
#
# Update a running sandbox:
#   openshell policy update my-sandbox --policy ./security/nous-policy.yaml
#
# Binary paths resolved inside the image:
#   readlink -f $(command -v node)  →  /usr/bin/node-26
#   readlink -f $(command -v git)   →  /usr/bin/git

# Pi reads its runtime from /opt/pi (base image install). Landlock blocks
# access to paths not listed here or in the automatic baseline (/usr, /lib,
# /etc, /tmp). include_workdir keeps /sandbox read-write.
filesystem_policy:
  include_workdir: true
  read_only:
    - /opt/pi
    - /run/secrets

network_policies:

  # ── Vertex AI inference (global + per-region) ─────────────────────────────
  # Add or remove regions to match your CLOUD_ML_REGION setting.
  vertex-ai-global:
    endpoints:
      - host: aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-us-east5:
    endpoints:
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-us-central1:
    endpoints:
      - host: us-central1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-europe-west1:
    endpoints:
      - host: europe-west1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  vertex-ai-asia-southeast1:
    endpoints:
      - host: asia-southeast1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── Google auth / token refresh ───────────────────────────────────────────
  google-auth:
    endpoints:
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
      - host: iamcredentials.googleapis.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
      - host: accounts.google.com
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26

  # ── GitHub — git clone for PR code reviews ────────────────────────────────
  github-git:
    endpoints:
      - host: github.com
        port: 443
        enforcement: enforce
      - host: codeload.github.com
        port: 443
        enforcement: enforce
      - host: objects.githubusercontent.com
        port: 443
        enforcement: enforce
    binaries:
      - path: /usr/bin/git

  github-api:
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/bin/node-26
