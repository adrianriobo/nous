# Container structure tests for nous
# Run with: container-structure-test test --image <image> --config tests/structure-test.yaml

schemaVersion: "2.0.0"

metadataTest:
  labels:
    - key: "io.openshell.sandbox.harness"
      value: "pi"
  envVars:
    - key: "AGENT_NAME"
      value: "pi"
  user: "1001"
  workdir: "/sandbox"
  entrypoint: ["/usr/local/bin/entrypoint.sh"]
  cmd: []

fileExistenceTests:
  - name: "entrypoint executable"
    path: "/usr/local/bin/entrypoint.sh"
    shouldExist: true
    permissions: "-rwxr-xr-x"

  - name: "pi wrapper present"
    path: "/usr/local/sbin/pi"
    shouldExist: true

  - name: "sandbox home directory"
    path: "/sandbox"
    shouldExist: true

  - name: "router extension entry point"
    path: "/sandbox/.pi/agent/extensions/router/index.ts"
    shouldExist: true

  - name: "subagent provider extension"
    path: "/sandbox/.pi/agent/extensions/router/subagent-provider.ts"
    shouldExist: true

  - name: "subagent research tools"
    path: "/sandbox/.pi/agent/extensions/router/subagent-tools.ts"
    shouldExist: true

  - name: "Slack thread reader"
    path: "/sandbox/.pi/agent/extensions/router/slack.ts"
    shouldExist: true

  - name: "journal extension entry point"
    path: "/sandbox/.pi/agent/extensions/journal/index.ts"
    shouldExist: true

  - name: "journal file helpers"
    path: "/sandbox/.pi/agent/extensions/journal/journal.ts"
    shouldExist: true

  - name: "window title extension entry point"
    path: "/sandbox/.pi/agent/extensions/title/index.ts"
    shouldExist: true

fileContentTests:
  - name: "entrypoint handles interactive and passthrough modes"
    path: "/usr/local/bin/entrypoint.sh"
    expectedContents:
      - "_check_auth"
      - "exec pi"

  # The journal protocol keeps the work state across container restarts.
  - name: "system instructions include the session journal protocol"
    path: "/sandbox/.pi/agent/APPEND_SYSTEM.md"
    expectedContents:
      - "## Session Journal"
      - "/workspace/journal.md"
      - "### Resume Procedure"
      - "- status: open"

  # The needles have no regular-expression metacharacters: this check treats
  # expectedContents as a pattern.
  - name: "journal extension records the request and the tool calls"
    path: "/sandbox/.pi/agent/extensions/journal/index.ts"
    expectedContents:
      - "tool_execution_end"
      - "name: \"journal\""
      - "session-journal-state"

  - name: "system instructions tell agents how to find a tool"
    path: "/sandbox/.pi/agent/APPEND_SYSTEM.md"
    expectedContents:
      - "## Tool Discovery"
      - "command -v"

commandTests:
  - name: "pi binary is on PATH"
    command: "bash"
    args: ["-c", "command -v pi"]
    exitCode: 0

  - name: "sandbox user is 1001"
    command: "bash"
    args: ["-c", "id -u"]
    exitCode: 0
    expectedOutput:
      - "1001"

  # Hummingbird OS has no package manager and no base utilities. These checks
  # guard issue #52: an agent must find each utility with `command -v`.
  - name: "base utilities are on PATH"
    command: "bash"
    args: ["-c", "command -v which curl ps openssl dig host nslookup"]
    exitCode: 0

  - name: "base utilities run"
    command: "bash"
    args: ["-c", "curl --version && openssl version && ps --version && dig -v"]
    exitCode: 0

  - name: "which resolves a tool that is in PATH"
    command: "bash"
    args: ["-c", "which bash node"]
    exitCode: 0
    expectedOutput:
      - "bash"
      - "node"
