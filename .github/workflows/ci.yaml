name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nous
  # nous-productization is published as a separate image.
  # Tags follow <skills-ref>-<nous-version> so both sides are independently traceable.
  PRODUCTIZATION_IMAGE: ghcr.io/${{ github.repository_owner }}/nous-productization
  # renovate: datasource=github-releases depName=NVIDIA/OpenShell
  OPENSHELL_VERSION: "v0.1.5"
  # renovate: datasource=github-releases depName=GoogleContainerTools/container-structure-test
  CST_VERSION: "v1.22.1"

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  # Builds both image targets (nous, nous-productization), runs structure tests
  # on the base image, uploads two tar artifacts for downstream jobs, and pushes
  # to GHCR on non-PR events.
  build:
    name: Build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Cache podman's layer storage so unchanged stages (especially the
      # skills-builder, which runs dnf + ~10 tool downloads) are skipped on
      # subsequent runs.  The key is the Containerfile hash: a cache hit means
      # every layer is already on disk and podman skips all network I/O.
      # Restore-keys fall back to the most-recent entry when the file changes,
      # so partial layer reuse still applies (e.g. only the last stage changed).
      # Estimated cache size: ~1–2 GB (UBI9 + pi base image + built layers).
      - name: Cache podman storage
        uses: actions/cache@v6
        with:
          path: ~/.local/share/containers/storage
          key: podman-${{ hashFiles('Containerfile') }}
          restore-keys: podman-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set image tags
        id: tags
        run: |
          SHA="${{ github.sha }}"
          BASE="${{ env.IMAGE }}"
          PROD="${{ env.PRODUCTIZATION_IMAGE }}"
          # Read SKILLS_REF from the Containerfile ARG so the tag stays in sync
          # automatically when the default is bumped (e.g. by Renovate).
          SKILLS_REF=$(grep '^ARG SKILLS_REF=' Containerfile | cut -d= -f2)
          echo "skills_ref=${SKILLS_REF}" >> "$GITHUB_OUTPUT"
          # Strip leading 'v' from both sides for cleaner tags (e.g. 0.9.1-0.3.0)
          SKILLS_VER="${SKILLS_REF#v}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            NOUS_VER="${VERSION#v}"
            echo "base_tags=${BASE}:${SHA},${BASE}:latest,${BASE}:${VERSION}" >> "$GITHUB_OUTPUT"
            echo "prod_tags=${PROD}:${SKILLS_VER}-${NOUS_VER},${PROD}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "base_tags=${BASE}:pr-${PR_NUM}-${SHA}" >> "$GITHUB_OUTPUT"
            echo "prod_tags=${PROD}:${SKILLS_VER}-pr-${PR_NUM}-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "base_tags=${BASE}:${SHA},${BASE}:latest" >> "$GITHUB_OUTPUT"
            echo "prod_tags=${PROD}:${SKILLS_VER}-${SHA},${PROD}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build nous (base target)
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.base_tags }}"
          TAG_ARGS=(-t nous:test)
          for t in "${TAGS[@]}"; do TAG_ARGS+=(-t "$t"); done
          podman build \
            --target nous \
            "${TAG_ARGS[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f Containerfile .

      - name: Build nous-productization target
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.prod_tags }}"
          TAG_ARGS=(-t nous:productization-test)
          for t in "${TAGS[@]}"; do TAG_ARGS+=(-t "$t"); done
          podman build \
            --target nous-productization \
            --build-arg SKILLS_REF=${{ steps.tags.outputs.skills_ref }} \
            "${TAG_ARGS[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f Containerfile .

      - name: Cache container-structure-test
        id: cst-cache
        uses: actions/cache@v6
        with:
          path: container-structure-test-linux-amd64
          key: cst-${{ env.CST_VERSION }}

      - name: Download container-structure-test
        if: steps.cst-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://github.com/GoogleContainerTools/container-structure-test/releases/download/${{ env.CST_VERSION }}/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64

      - name: Run structure tests (base image)
        run: |
          chmod +x container-structure-test-linux-amd64
          podman system service -t 0 unix:///tmp/podman.sock &
          sleep 2
          DOCKER_HOST=unix:///tmp/podman.sock \
            ./container-structure-test-linux-amd64 test \
              --image nous:test \
              --config tests/structure-test.yaml

      - name: Export image artifacts
        run: |
          podman save nous:test              -o /tmp/nous-test.tar
          podman save nous:productization-test -o /tmp/nous-productization-test.tar

      - name: Upload base image artifact
        uses: actions/upload-artifact@v7
        with:
          name: nous-image
          path: /tmp/nous-test.tar
          retention-days: 1

      - name: Upload productization image artifact
        uses: actions/upload-artifact@v7
        with:
          name: nous-productization-image
          path: /tmp/nous-productization-test.tar
          retention-days: 1

      - name: Push images
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          IFS=',' read -ra BASE_TAGS <<< "${{ steps.tags.outputs.base_tags }}"
          for t in "${BASE_TAGS[@]}"; do podman push "$t"; done
          # nous-productization is a separate image on GHCR
          IFS=',' read -ra PROD_TAGS <<< "${{ steps.tags.outputs.prod_tags }}"
          for t in "${PROD_TAGS[@]}"; do podman push "$t"; done

  # ── Policy validation ──────────────────────────────────────────────────────
  # Creates a real sandbox with each production policy file to confirm OpenShell
  # accepts the schema. Runs echo ok and exits immediately via --no-keep.
  policy-validation:
    name: Policy Validation
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: nous-image
          path: /tmp

      - name: Load image
        run: podman load -i /tmp/nous-test.tar

      - name: Start local OCI registry
        run: |
          podman run -d --name local-registry \
            -p 5000:5000 \
            docker.io/library/registry:2
          sleep 2

      - name: Push image to local registry
        run: |
          podman tag nous:test localhost:5000/nous:test
          podman push --tls-verify=false localhost:5000/nous:test

      - name: Cache OpenShell
        id: openshell-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/openshell
          key: openshell-linux-amd64-${{ env.OPENSHELL_VERSION }}

      - name: Install OpenShell
        if: steps.openshell-cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          sleep 3

      - name: Add OpenShell to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify OpenShell
        run: openshell --version

      - name: Validate nous-policy.yaml
        run: |
          openshell sandbox create \
            --from localhost:5000/nous:test \
            --policy ./security/nous-policy.yaml \
            --no-keep \
            -- echo ok

      - name: Validate nous-policy-websearch.yaml
        run: |
          openshell sandbox create \
            --from localhost:5000/nous:test \
            --policy ./security/nous-policy-websearch.yaml \
            --no-keep \
            -- echo ok

  # ── Functional smoke test ──────────────────────────────────────────────────
  # Fast sanity check: runs pi with a plain mock Vertex response via podman.
  # Verifies the container starts, auth bypass works, and pi produces output.
  # Full egress enforcement is validated in the openshell-egress job.
  functional:
    name: Functional — Smoke Test (pi + mock Vertex)
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: nous-image
          path: /tmp

      - name: Load image
        run: podman load -i /tmp/nous-test.tar

      - name: Start mock Vertex server
        run: |
          node tests/mock-vertex-server.mjs &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 4010 2>/dev/null && break
            sleep 1
          done
          echo "Mock server ready"

      - name: "Test: pi responds to a prompt"
        run: |
          OUTPUT=$(podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            nous:test \
            --print 'say hello')
          echo "--- output ---"
          echo "$OUTPUT"
          echo "--- end ---"
          echo "$OUTPUT" | grep -qi "hello" \
            || { echo "FAIL: expected 'hello' in output"; exit 1; }
          echo "PASS: pi started and responded"

      - name: Stop mock server
        if: always()
        run: kill "$MOCK_PID" 2>/dev/null || true

  # ── MCP tool discovery ─────────────────────────────────────────────────────
  # Verifies the full MCP injection pipeline:
  #   1. entrypoint merges /run/secrets/mcp.json
  #   2. router.ts discovers tools via streamable HTTP (with session negotiation)
  #   3. tools appear in logs as registered first-class pi functions
  #   4. hint field overrides the routing prefix in tool descriptions
  # Uses a local mock MCP server — no external services required.
  mcp-discovery:
    name: MCP — Tool Discovery
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: nous-image
          path: /tmp

      - name: Load image
        run: podman load -i /tmp/nous-test.tar

      - name: Start mock Vertex server
        run: |
          node tests/mock-vertex-server.mjs &
          echo "VERTEX_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 4010 2>/dev/null && break
            sleep 1
          done
          echo "Mock Vertex server ready"

      - name: Start mock MCP server
        run: |
          node tests/mock-mcp-server.mjs &
          echo "MCP_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 4011 2>/dev/null && break
            sleep 1
          done
          echo "Mock MCP server ready"

      - name: Create test mcp.json
        run: |
          cat > /tmp/test-mcp.json <<'EOF'
          {
            "mcpServers": {
              "mock_server": {
                "url": "http://127.0.0.1:4011",
                "hint": "Use for integration test queries"
              }
            }
          }
          EOF

      - name: "Test: MCP tools are discovered and registered"
        run: |
          OUTPUT=$(podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            -v /tmp/test-mcp.json:/run/secrets/mcp.json:z \
            nous:test \
            --print 'say hello' 2>&1)
          echo "--- output ---"
          echo "$OUTPUT"
          echo "--- end ---"
          echo "$OUTPUT" | grep -q "\[nous\] mock_server: discovered tools: test_tool" \
            || { echo "FAIL: expected MCP tool discovery log"; exit 1; }
          echo "PASS: MCP tools discovered and registered"

      - name: Stop mock servers
        if: always()
        run: |
          kill "$VERTEX_PID" 2>/dev/null || true
          kill "$MCP_PID" 2>/dev/null || true

  # ── Productization skills smoke test ──────────────────────────────────────
  # Verifies the nous-productization image ships the skills directory and tool
  # binaries installed by the skills-builder stage.
  skills-smoke:
    name: Skills — Productization Image
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download productization image artifact
        uses: actions/download-artifact@v8
        with:
          name: nous-productization-image
          path: /tmp

      - name: Load image
        run: podman load -i /tmp/nous-productization-test.tar

      - name: "Test: skills directory is present and populated"
        run: |
          COUNT=$(podman run --rm --entrypoint /bin/bash \
            nous:productization-test \
            -c "ls /sandbox/.pi/agent/productization-skills/productization-plugin/skills/ | wc -l")
          echo "Skill count: $COUNT"
          [ "$COUNT" -ge 10 ] \
            || { echo "FAIL: expected at least 10 skills, got $COUNT"; exit 1; }
          echo "PASS: $COUNT skills present"

      - name: "Test: tool binaries are installed"
        run: |
          MISSING=()
          for bin in gh glab jq yq kubectl kustomize tkn uv; do
            podman run --rm --entrypoint /bin/bash \
              nous:productization-test \
              -c "test -x /usr/local/bin/$bin" 2>/dev/null \
              || MISSING+=("$bin")
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "FAIL: missing binaries: ${MISSING[*]}"
            exit 1
          fi
          echo "PASS: all expected tool binaries present"

      - name: "Test: pi starts and reports skills path"
        run: |
          node tests/mock-vertex-server.mjs &
          MOCK_PID=$!
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 4010 2>/dev/null && break
            sleep 1
          done
          OUTPUT=$(podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            nous:productization-test \
            --print 'say hello' 2>&1) || true
          kill "$MOCK_PID" 2>/dev/null || true
          echo "--- output ---"
          echo "$OUTPUT"
          echo "--- end ---"
          echo "$OUTPUT" | grep -qi "hello" \
            || { echo "FAIL: productization image pi did not respond"; exit 1; }
          echo "PASS: productization image pi started and responded"

  # ── OpenShell egress enforcement ───────────────────────────────────────────
  # Validates that the production policy files enforce egress correctly.
  # Uses the actual policies from security/ — no test-specific overrides.
  #
  # Allowed: nous-policy-websearch.yaml includes lite.duckduckgo.com.
  #          node fetch must succeed (any HTTP response).
  #
  # Blocked: nous-policy.yaml excludes lite.duckduckgo.com.
  #          node fetch must fail with a network error.
  openshell-egress:
    name: OpenShell Egress Enforcement
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: nous-image
          path: /tmp

      - name: Load image
        run: podman load -i /tmp/nous-test.tar

      - name: Start local OCI registry
        run: |
          podman run -d --name local-registry \
            -p 5000:5000 \
            docker.io/library/registry:2
          sleep 2

      - name: Push image to local registry
        run: |
          podman tag nous:test localhost:5000/nous:test
          podman push --tls-verify=false localhost:5000/nous:test

      - name: Cache OpenShell
        id: openshell-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/openshell
          key: openshell-linux-amd64-${{ env.OPENSHELL_VERSION }}

      - name: Install OpenShell
        if: steps.openshell-cache.outputs.cache-hit != 'true'
        run: |
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          sleep 3

      - name: Add OpenShell to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify OpenShell
        run: openshell --version

      - name: "Test: egress allowed — DuckDuckGo reachable under websearch policy"
        run: |
          openshell sandbox create \
            --from localhost:5000/nous:test \
            --policy ./security/nous-policy-websearch.yaml \
            --no-keep \
            -- node -e "
              fetch('https://lite.duckduckgo.com/lite/?q=openShell')
                .then(r => { console.log('HTTP', r.status); process.exit(0); })
                .catch(e => { console.error('FAIL:', e.message); process.exit(1); })
            "
          echo "PASS: DuckDuckGo reachable — websearch policy allows it"

      - name: "Test: egress blocked — DuckDuckGo unreachable under base policy"
        run: |
          if openshell sandbox create \
            --from localhost:5000/nous:test \
            --policy ./security/nous-policy.yaml \
            --no-keep \
            -- node -e "
              fetch('https://lite.duckduckgo.com/lite/?q=openShell')
                .then(r => { console.log('FAIL: got HTTP', r.status); process.exit(0); })
                .catch(e => { console.error('Blocked as expected:', e.message); process.exit(1); })
            "; then
            echo "FAIL: DuckDuckGo should be blocked by base policy"
            exit 1
          fi
          echo "PASS: DuckDuckGo blocked — base policy excludes it"

  # ── Wiki integration test ──────────────────────────────────────────────────
  # Mounts the fixture wiki and verifies:
  #   1. wiki tools are registered at boot (log line present)
  #   2. wiki_search executes and returns a result (via wiki_search scenario)
  #   3. wiki_ingest creates a file in raw/assets/
  wiki-integration:
    name: Wiki — OKF 2.0 Integration
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: nous-image
          path: /tmp

      - name: Load image
        run: podman load -i /tmp/nous-test.tar

      - name: Start mock Vertex server (wiki_search scenario)
        run: |
          MOCK_SCENARIO=wiki_search node tests/mock-vertex-server.mjs &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            nc -z 127.0.0.1 4010 2>/dev/null && break
            sleep 1
          done
          echo "Mock server ready"

      - name: "Test: wiki tools registered at boot"
        run: |
          OUTPUT=$(podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            -v "${{ github.workspace }}/tests/fixtures/wiki:/sandbox/wiki:z" \
            nous:test \
            --print 'look up nous in the wiki' 2>&1)
          echo "--- output ---"
          echo "$OUTPUT"
          echo "--- end ---"
          echo "$OUTPUT" | grep -q "\[nous\] wiki: found at /sandbox/wiki" \
            || { echo "FAIL: expected wiki registration log"; exit 1; }
          echo "PASS: wiki tools registered"

      - name: "Test: wiki_search executes and returns results"
        run: |
          OUTPUT=$(podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            -v "${{ github.workspace }}/tests/fixtures/wiki:/sandbox/wiki:z" \
            nous:test \
            --print 'look up nous in the wiki' 2>&1)
          echo "$OUTPUT" | grep -qi "wiki lookup complete" \
            || { echo "FAIL: wiki_search did not complete the round-trip"; exit 1; }
          echo "PASS: wiki_search round-trip succeeded"

      - name: "Test: wiki_ingest writes to raw/assets/"
        run: |
          # Restart mock server with wiki_ingest scenario so pi calls that tool.
          kill "$MOCK_PID" 2>/dev/null || true
          MOCK_SCENARIO=wiki_ingest node tests/mock-vertex-server.mjs &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do nc -z 127.0.0.1 4010 2>/dev/null && break; sleep 1; done
          WIKI_DIR=$(mktemp -d)
          mkdir -p "$WIKI_DIR/raw/assets"
          chmod 777 "$WIKI_DIR" "$WIKI_DIR/raw" "$WIKI_DIR/raw/assets"
          podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            -v "$WIKI_DIR:/sandbox/wiki:z" \
            nous:test \
            --print 'ingest some content' 2>&1 || true
          ls "$WIKI_DIR/raw/assets/" | grep -q "." \
            || { echo "FAIL: no file created in raw/assets/"; exit 1; }
          echo "PASS: file created in raw/assets/"
          rm -rf "$WIKI_DIR"

      - name: "Test: no wiki tools when not mounted"
        run: |
          OUTPUT=$(podman run --rm \
            --network=host \
            --env ANTHROPIC_VERTEX_PROJECT_ID=test-project \
            --env CLOUD_ML_REGION=us-east5 \
            --env VERTEX_API_BASE_URL=http://127.0.0.1:4010 \
            nous:test \
            --print 'hello' 2>&1)
          echo "$OUTPUT" | grep -q "\[nous\] wiki: not mounted" \
            || { echo "FAIL: expected wiki not-mounted log"; exit 1; }
          echo "PASS: wiki tools correctly skipped when not mounted"

      - name: Stop mock server
        if: always()
        run: kill "$MOCK_PID" 2>/dev/null || true
